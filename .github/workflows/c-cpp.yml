name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install 32 bit development libraries
      run: sudo dpkg --add-architecture i386 && sudo apt-get update && sudo apt-get install gcc-multilib g++-multilib libx11-dev:i386 libfreetype6-dev:i386
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
